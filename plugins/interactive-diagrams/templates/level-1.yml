# Level 1 starter: structure. Copy to diagrams/<name>/diagram.yml and replace every <…>.
# Rules: reference/structure.md · keys: reference/data-format.md
title: <System name>
description: "<One sentence: what the system does and for whom.>"
level: 1
levels: [Context, Containers]   # one name per level; add one per extra layer of children

nodes:
  - id: user
    label: <User>
    icon: user
    status: external
    facts:
      summary: "<Who they are and what they come to the system for.>"
      how: "<How they reach it: browser, CLI, app.>"
      api: "None of its own: <what they use>"

  - id: system
    label: <System>
    icon: cluster
    status: built
    facts:
      summary: "<What the system is and why it exists.>"
      how: "<Where it runs and how it is put together.>"
      url: {Home: "https://<address>"}
    children:
      - id: frontend
        label: <Frontend>
        icon: browser
        status: built
        facts:
          summary: "<What it is and why it's here.>"
          how: "<Mechanism, protocol, what it owns.>"
          api: "`<host>:<port>`"
      - id: backend
        label: <Backend>
        icon: api
        status: built
        facts:
          summary: "<What it is and why it's here.>"
          how: "<Mechanism, protocol, what it owns.>"
          api: "`<host>:<port>`"
      - id: store
        label: <Database>
        icon: database
        status: built
        facts:
          summary: "<What it stores and why.>"
          how: "<Engine, replication, who connects.>"
          api: "`<host>:<port>`"

  - id: external
    label: <External service>
    icon: cloud
    status: external
    facts:
      summary: "<What the system uses it for.>"
      how: "<How the system calls it and authenticates.>"
      api: "`https://<address>`"

edges:
  - {id: u_fe, from: user, to: frontend, proto: HTTPS, port: 443, why: "Always on: <when the user uses this path>."}
  - {id: fe_be, from: frontend, to: backend, proto: HTTP, port: 8080, why: "Used when <trigger>: <purpose>."}
  - {id: be_db, from: backend, to: store, proto: PostgreSQL, port: 5432, why: "Used for <reads and writes>."}
  - {id: be_ext, from: backend, to: external, proto: HTTPS, port: 443, why: "Used when <trigger>: <purpose>."}
